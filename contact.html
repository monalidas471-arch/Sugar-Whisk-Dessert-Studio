<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sugar Whisk Design Studio - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #F0F4F8;">

    <div class="float-decoration sparkle-1" style="color: #63B3ED;">✉️</div>

    <header>
        <div class="header-wrapper">
            <div class="logo" style="color: #2B6CB0;">🧁 Sugar Whisk Studio</div>
            <nav>
                <a href="index.html">Home</a>
                <a href="catalog.html">Catalog</a>
                <a href="countries.html">World Sweets</a>
                <a href="contact.html" class="active" style="background: #BEE3F8; color: #2C5282;">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 style="text-align: center; font-size: 42px; color: #1A365D; margin-bottom: 10px;">Get in Touch</h1>
        <p style="text-align: center; color: #4A5568; margin-bottom: 40px; font-size: 18px;">Have a custom cake design or inquiry? Send us a message!</p>
        
        <div class="contact-layout">
            <form class="contact-form">
                <label for="name" style="color: #2B6CB0;">Your Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email" style="color: #2B6CB0;">Your Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message" style="color: #2B6CB0;">Your Message</label>
                <textarea id="message" placeholder="Write your message here..."></textarea>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 25px; background: #3182CE; box-shadow: 0 5px 0 #2B6CB0;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sugar Whisk Design Studio. All rights reserved.</p>
    </footer>

</body>
</html>
