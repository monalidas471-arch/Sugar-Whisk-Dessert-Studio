<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sugar Whisk Design Studio - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-wrapper">
            <div class="logo">🧁 Sugar Whisk Studio</div>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="catalog.html">Catalog</a>
                <a href="countries.html">World Sweets</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 style="text-align: center; font-size: 38px; color: #8B5964; margin-bottom: 10px;">Get in Touch</h1>
        <p style="text-align: center; color: #6E575D; margin-bottom: 35px; font-size: 17px;">Have a custom design request or inquiry? Send us a message!</p>
        
        <div class="contact-layout">
            <form class="contact-form">
                <label for="name">Your Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Your Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Your Message</label>
                <textarea id="message" placeholder="Write your message here..."></textarea>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Sugar Whisk Design Studio. All rights reserved.</p>
    </footer>

</body>
</html>
